info:
  name: Update file sharing settings
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{url}}/shares/file/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "isPublic": true,
        "sharedWith": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
