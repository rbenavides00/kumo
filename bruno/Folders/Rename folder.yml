info:
  name: Rename folder
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{url}}/folders/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "New folder name"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
