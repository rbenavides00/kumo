info:
  name: Get folder contents
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/folders/contents?filter=sharedWithMe&page=1&pageSize=10"
  params:
    - name: filter
      value: sharedWithMe
      type: query
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
