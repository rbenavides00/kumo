info:
  name: Get specific folder contents
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/folders/:id/contents?page=1&pageSize=10"
  params:
    - name: filter
      value: sharedWithMe
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "10"
      type: query
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
