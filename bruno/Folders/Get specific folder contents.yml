info:
  name: Get specific folder contents
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/folders/:folderID/contents"
  params:
    - name: folderID
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
