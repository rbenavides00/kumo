info:
  name: Update current user password
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{url}}/users/me/password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "12345678",
        "newPassword": "87654321"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
