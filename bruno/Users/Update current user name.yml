info:
  name: Update current user name
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{url}}/users/me"
  body:
    type: json
    data: |-
      {
        "firstName": "First name",
        "lastName": "Last name"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
