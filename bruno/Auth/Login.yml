info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "test",
        "password": "12345678"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
